[package]
name = "minute-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["std"] }
blake3 = "1"
bitcoin = "0.32"
anyhow = "1"

[profile.release]
lto = true
# money math must never wrap silently: trap arithmetic overflow in release too.
overflow-checks = true
